services:
  postgres:
    image: postgres:18.2
    container_name: spark_postgres
    environment:
      POSTGRES_USER: spark_user
      POSTGRES_PASSWORD: spark_password
      POSTGRES_DB: spark_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/18/docker

  clickhouse:
    image: clickhouse/clickhouse-server:26.2
    container_name: spark_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=spark_user
      - CLICKHOUSE_PASSWORD=spark_password
      - CLICKHOUSE_DB=analytics_db
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse

  mongodb:
    image: mongo:8.2.5
    container_name: spark_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=spark_user
      - MONGO_INITDB_ROOT_PASSWORD=spark_password
    volumes:
      - mongodata:/data/db

  mongo-express:
    image: mongo-express
    container_name: spark_mongo_express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=spark_user
      - ME_CONFIG_MONGODB_ADMINPASSWORD=spark_password
      - ME_CONFIG_MONGODB_SERVER=mongodb

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: spark_minio
    ports:
      - "9002:9000" # Меняем порт на 9002, чтобы не конфликтовать с ClickHouse
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  chdata:
  mongodata:
  miniodata: